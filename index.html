<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/ui/tokens.css" />
    <link rel="stylesheet" href="/src/styles.css" />
    <title>tterm</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <div id="tab-bar">
      <button id="settings-btn" aria-label="Settings"></button>
      <div id="tabs">
        <!-- + and dropdown live INSIDE #tabs as the last flex item so they
             stay flush against the last tab. position:sticky pins them to
             the right edge when the tab strip overflows and scrolls.
             New tab elements are inserted before this group. -->
        <div id="new-tab-group">
          <span id="tab-overflow-count" aria-hidden="true"></span>
          <button id="new-tab" aria-label="New tab" title="New tab"><span class="plus">+</span></button>
          <button id="new-tab-menu-btn" aria-label="New tab options">
            <svg width="8" height="8" viewBox="0 0 8 8">
              <path d="M1 2.5l3 3 3-3" stroke="currentColor" stroke-width="1.2" fill="none"/>
            </svg>
          </button>
        </div>
      </div>
      <div id="drag-spacer" data-tauri-drag-region></div>
      <div id="window-controls">
        <div id="quick-actions">
          <button id="quick-status" aria-label="Session quick actions" title="Session quick actions"></button>
          <span class="win-divider" aria-hidden="true"></span>
          <button id="btn-park-tray" class="win-btn" aria-label="Park to tray"></button>
        </div>
        <span class="win-divider" aria-hidden="true"></span>
        <button id="btn-minimize" class="win-btn" aria-label="Minimize"></button>
        <button id="btn-maximize" class="win-btn" aria-label="Maximize"></button>
        <button id="btn-close" class="win-btn" aria-label="Close"></button>
      </div>
    </div>
    <div id="terminal-container"></div>
  </body>
</html>
