<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tterm</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <div id="tab-bar">
      <div id="tabs"></div>
      <button id="new-tab">+</button>
      <div id="drag-spacer" data-tauri-drag-region></div>
      <div id="window-controls">
        <button id="btn-minimize" class="win-btn" aria-label="Minimize"></button>
        <button id="btn-maximize" class="win-btn" aria-label="Maximize"></button>
        <button id="btn-close" class="win-btn" aria-label="Close"></button>
      </div>
    </div>
    <div id="terminal-container"></div>
  </body>
</html>
