name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        run: bun install

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build
        # Updater artifacts (.sig) are only produced by the release workflow,
        # which holds TAURI_SIGNING_PRIVATE_KEY. CI (esp. fork PRs, where
        # secrets are unavailable) skips them so tauri build doesn't demand
        # the signing key.
        run: bun run tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: tterm-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
