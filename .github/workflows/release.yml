name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        run: bun install

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build
        run: bun run tauri build

      - name: Find installer
        id: find
        shell: pwsh
        run: |
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          echo "path=$exe" >> $env:GITHUB_OUTPUT
          echo "name=$($exe.Name)" >> $env:GITHUB_OUTPUT

      - name: Extract tag body to file
        shell: pwsh
        run: |
          $body = git tag -l --format='%(contents:body)' $env:GITHUB_REF_NAME
          if ([string]::IsNullOrWhiteSpace($body)) {
            $body = git tag -l --format='%(contents)' $env:GITHUB_REF_NAME
            Write-Host "WARNING: body was empty, falling back to full contents"
          }
          $body | Out-File -FilePath release-notes.md -Encoding utf8
          Write-Host "Release notes length: $($body.Length) chars"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.find.outputs.path }}
          name: ${{ github.ref_name }}
          body_path: release-notes.md
