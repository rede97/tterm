name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        run: bun install

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build
        run: bun run tauri build

      - name: Find installer
        id: find
        shell: pwsh
        run: |
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          echo "path=$exe" >> $env:GITHUB_OUTPUT
          echo "name=$($exe.Name)" >> $env:GITHUB_OUTPUT

      - name: Extract tag message to file
        shell: pwsh
        run: |
          $raw = git cat-file tag $env:GITHUB_REF_NAME
          # Tag object format: headers (object/type/tag/tagger), blank line, message
          $inBody = $false
          $lines = @()
          foreach ($line in ($raw -split "`n")) {
            if ($inBody) { $lines += $line }
            elseif ($line -eq '') { $inBody = $true }
          }
          $body = $lines -join "`n"
          $body | Out-File -FilePath release-notes.md -Encoding utf8 -NoNewline
          Write-Host "Release notes: $($lines.Count) lines, $($body.Length) chars"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.find.outputs.path }}
          name: ${{ github.ref_name }}
          body_path: release-notes.md
