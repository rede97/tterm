name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        run: bun install

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Extract release notes from CHANGELOG.md
        id: notes
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $changelog = Get-Content CHANGELOG.md -Raw
          $inSection = $false
          $lines = @()
          $heading = [regex]::Escape($tag)
          foreach ($line in ($changelog -split "`n")) {
            if ($line -match '^## ') {
              if ($inSection) { break }
              # "## v3.0.1" or "## v3.0.1 (beta)" — not the first ## v in the file.
              if ($line -match "^## ${heading}(\s|$)") {
                $inSection = $true
              }
              continue
            }
            if ($inSection) { $lines += $line }
          }
          if (-not $inSection) {
            throw "CHANGELOG.md has no '$tag' section"
          }
          $body = ($lines -join "`n").Trim()
          if (-not $body) {
            throw "CHANGELOG.md section '$tag' is empty"
          }
          echo "body<<EOF" >> $env:GITHUB_OUTPUT
          echo $body >> $env:GITHUB_OUTPUT
          echo "EOF" >> $env:GITHUB_OUTPUT
          Write-Host "Release notes: $($lines.Count) lines, $($body.Length) chars"

      - name: Sync version from tag
        # The tag is the single source of truth for the release version:
        # installer filenames (and the updater manifest) always follow it,
        # even if the in-repo version fields were not bumped beforehand.
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}" -replace '^v', ''
          Write-Host "Syncing version $v from tag"
          (Get-Content src-tauri/tauri.conf.json -Raw) -replace '"version": "[^"]*"', "`"version`": `"$v`"" | Set-Content src-tauri/tauri.conf.json -NoNewline
          (Get-Content package.json -Raw) -replace '"version": "[^"]*"', "`"version`": `"$v`"" | Set-Content package.json -NoNewline
          (Get-Content src-tauri/Cargo.toml -Raw) -replace '(?m)^version = "[^"]*"', "version = `"$v`"" | Set-Content src-tauri/Cargo.toml -NoNewline

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
