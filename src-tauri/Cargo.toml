[package]
name = "tterm"
version = "3.0.0"
description = "A Tauri App"
authors = ["rede97"]
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tterm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
portable-pty = "0.8"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-window-state = "2.4.1"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
winreg = "0.52"
serial_enumerator = "0.3"
serialport = "4"
tokio = { version = "1", features = ["sync", "net", "rt", "macros", "time"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["__rustls-tls", "connect", "handshake"] }
futures-util = "0.3"
http = "1"
httparse = "1"
rand = "0.9"
chrono = "0.4"

# Cross-process tray: window lookup/restore and process liveness by pid.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_Devices_Communication",
] }
base64 = "0.23.1"
russh = { version = "0.62", default-features = false, features = ["ring", "rsa", "flate2"] }
# OS RNG for keygen, adapted to ssh-key's rand_core 0.10 traits below.
getrandom = "0.4"
rand_core = "0.10"
# Hashed known_hosts (`|1|salt|hash`) matching for key re-learn — same
# HMAC-SHA1 construction OpenSSH uses (and russh already pulls in).
hmac = "0.13"
sha1 = "0.11"
